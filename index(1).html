<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2f5b" />
  <meta name="description" content="Interactive Heyzine Flipbook" />
  <title>Interactive Flipbook</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --navy: #0b2f5b;
      --gold: #d9a326;
      --text: #17324d;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: var(--navy);
      color: var(--white);
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
      z-index: 2;
    }

    .title {
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      white-space: nowrap;
      background: var(--gold);
      color: #11263e;
      font-weight: 700;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
    }

    .viewer {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: #e9edf3;
    }

    .viewer iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #5b6b7d;
      background: #eef2f7;
      z-index: 0;
    }

    .viewer iframe {
      z-index: 1;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 8px 10px;
      }

      .title {
        max-width: 62%;
      }

      .open-btn {
        padding: 8px 11px;
        font-size: 12px;
      }
    }

    @media (display-mode: standalone) {
      .topbar {
        padding-top: max(10px, env(safe-area-inset-top));
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <h1 class="title">Interactive Flipbook</h1>
      <a
        class="open-btn"
        href="https://heyzine.com/flip-book/a4922e534f.html"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open flipbook in a new tab">
        Open Fullscreen
      </a>
    </header>

    <section class="viewer" aria-label="Heyzine flipbook viewer">
      <div class="loading">
        <div>
          <strong>Loading flipbook…</strong><br />
          If it does not appear, use the “Open Fullscreen” button.
        </div>
      </div>

      <iframe
        src="https://heyzine.com/flip-book/a4922e534f.html"
        title="Heyzine Flipbook"
        allow="clipboard-write; fullscreen"
        allowfullscreen
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>
  </main>
</body>
</html>
